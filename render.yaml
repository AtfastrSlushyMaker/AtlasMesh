# Public showcase: the live globe only. The Intel workspace and API key
# settings are switched off (ATLAS_MODE=showcase) so this server never
# spends API credit or runs lookups for visitors; the app shows them how to
# run their own copy instead.
services:
  - type: web
    name: atlasmesh
    runtime: node
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ATLAS_MODE
        value: showcase
      # Optional keys that only improve the public globe:
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: AISSTREAM_TOKEN
        sync: false
